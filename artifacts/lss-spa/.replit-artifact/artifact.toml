kind = "web"
previewPath = "/"
title = "LSS Spa and Wellness"
version = "1.0.0"
id = "artifacts/lss-spa"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18679

[services.development]
run = "pnpm --filter @workspace/lss-spa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lss-spa", "run", "build" ]
publicDir = "artifacts/lss-spa/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18679"
BASE_PATH = "/"
